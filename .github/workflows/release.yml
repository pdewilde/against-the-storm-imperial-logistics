name: Build & Attest Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  ATS_API_VERSION: "3.7.0"
  ATS_API_SHA256: "331d34fe4d1df16cd1ad4dfeae8e91e2418d426bf7284be648cc9976e315f99d"
  ATS_REFS_SHA256: "da31f76d8f9638e0b002a0ea02c12fa1a310896721db3a4fc9cd6285c1653650"

jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      ATS_REFS_URL: ${{ secrets.ATS_REFS_URL }}
      ATS_REFS_TOKEN: ${{ secrets.ATS_REFS_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Build PR (when CI reference stubs secret is available)
        run: |
          if [ -z "$ATS_REFS_URL" ]; then
            echo "::notice::Skipping full compile on external fork PR because repository secrets (ATS_REFS_URL) are withheld on fork pull requests."
            exit 0
          fi

          mkdir -p ci-libs
          curl -fsSL "https://thunderstore.io/package/download/ATS_API_Devs/API/${ATS_API_VERSION}/" -o api_pkg.zip
          echo "${ATS_API_SHA256}  api_pkg.zip" | sha256sum -c -
          unzip -j -q api_pkg.zip "API.dll" -d ci-libs/ || unzip -j -q api_pkg.zip "*/API.dll" -d ci-libs/
          rm -f api_pkg.zip

          FETCH_URL="$ATS_REFS_URL"
          ACCEPT_HDR="application/octet-stream"
          if [[ "$FETCH_URL" =~ ^https://raw\.githubusercontent\.com/([^/]+)/([^/]+)/([^/]+)/(.+)$ ]]; then
            FETCH_URL="https://api.github.com/repos/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/contents/${BASH_REMATCH[4]}?ref=${BASH_REMATCH[3]}"
            ACCEPT_HDR="application/vnd.github.raw+json"
          elif [[ "$FETCH_URL" == *"/contents/"* ]]; then
            ACCEPT_HDR="application/vnd.github.raw+json"
          fi

          if [ -n "$ATS_REFS_TOKEN" ]; then
            curl -fsSL -H "Authorization: Bearer $ATS_REFS_TOKEN" -H "Accept: $ACCEPT_HDR" -H "X-GitHub-Api-Version: 2022-11-28" "$FETCH_URL" -o ci-refs.zip
          else
            curl -fsSL "$FETCH_URL" -o ci-refs.zip
          fi
          echo "${ATS_REFS_SHA256}  ci-refs.zip" | sha256sum -c -
          unzip -q ci-refs.zip -d ci-libs/
          rm -f ci-refs.zip

          dotnet restore ATS_ImperialLogistics.csproj --locked-mode
          dotnet build ATS_ImperialLogistics.csproj -c Release --no-restore

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Fetch & verify ATS_API from Thunderstore + stripped game reference stubs
        env:
          ATS_REFS_URL: ${{ secrets.ATS_REFS_URL }}
          ATS_REFS_TOKEN: ${{ secrets.ATS_REFS_TOKEN }}
        run: |
          mkdir -p ci-libs
          curl -fsSL "https://thunderstore.io/package/download/ATS_API_Devs/API/${ATS_API_VERSION}/" -o api_pkg.zip
          echo "${ATS_API_SHA256}  api_pkg.zip" | sha256sum -c -
          unzip -j -q api_pkg.zip "API.dll" -d ci-libs/ || unzip -j -q api_pkg.zip "*/API.dll" -d ci-libs/
          rm -f api_pkg.zip

          if [ -z "$ATS_REFS_URL" ]; then
            echo "::error::Secret ATS_REFS_URL is not configured. Run scripts/pack-ci-refs.ps1 locally, upload obj/ci-refs.zip to a private repo release, and set ATS_REFS_URL (+ optional ATS_REFS_TOKEN)."
            exit 1
          fi

          FETCH_URL="$ATS_REFS_URL"
          ACCEPT_HDR="application/octet-stream"
          if [[ "$FETCH_URL" =~ ^https://raw\.githubusercontent\.com/([^/]+)/([^/]+)/([^/]+)/(.+)$ ]]; then
            FETCH_URL="https://api.github.com/repos/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/contents/${BASH_REMATCH[4]}?ref=${BASH_REMATCH[3]}"
            ACCEPT_HDR="application/vnd.github.raw+json"
          elif [[ "$FETCH_URL" == *"/contents/"* ]]; then
            ACCEPT_HDR="application/vnd.github.raw+json"
          fi

          if [ -n "$ATS_REFS_TOKEN" ]; then
            curl -fsSL -H "Authorization: Bearer $ATS_REFS_TOKEN" -H "Accept: $ACCEPT_HDR" -H "X-GitHub-Api-Version: 2022-11-28" "$FETCH_URL" -o ci-refs.zip
          else
            curl -fsSL "$FETCH_URL" -o ci-refs.zip
          fi
          echo "${ATS_REFS_SHA256}  ci-refs.zip" | sha256sum -c -
          unzip -q ci-refs.zip -d ci-libs/
          rm -f ci-refs.zip

      - name: Restore (Locked Mode) & Build (Release)
        run: |
          dotnet restore ATS_ImperialLogistics.csproj --locked-mode
          dotnet build ATS_ImperialLogistics.csproj -c Release --no-restore
          rm -rf ci-libs

      - name: Stage Release Files & Generate SHA-256 Checksums
        run: |
          cp bin/Release/ATS_ImperialLogistics.dll dist/ATS_ImperialLogistics.dll
          cd dist
          sha256sum pdewilde-ImperialLogistics-*.zip ATS_ImperialLogistics.dll > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest Build Provenance (SLSA / Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/pdewilde-ImperialLogistics-*.zip
            dist/ATS_ImperialLogistics.dll

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdewilde-ImperialLogistics-package
          path: |
            dist/pdewilde-ImperialLogistics-*.zip
            dist/ATS_ImperialLogistics.dll
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            dist/pdewilde-ImperialLogistics-*.zip
            dist/ATS_ImperialLogistics.dll
            dist/SHA256SUMS.txt
